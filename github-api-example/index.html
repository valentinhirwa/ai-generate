<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub API Example</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    img { width: 100px; border-radius: 50%; }
  </style>
</head>
<body>
  <h1>GitHub User Search</h1>

  <!-- Step 1: an input and a button -->
  <input id="username" value="octocat" placeholder="GitHub username">
  <button onclick="search()">Search</button>

  <!-- Step 2: the result will be shown here -->
  <div id="result"></div>

  <script>
    async function search() {
      const username = document.getElementById("username").value;
      const result = document.getElementById("result");
      result.textContent = "Loading...";

      try {
        // Step 3: call the API with fetch()
        const response = await fetch("https://api.github.com/users/" + username);

        // Step 4: check for errors (404 = not found, 403 = rate limit)
        if (!response.ok) {
          result.textContent = "Error " + response.status;
          return;
        }

        // Step 5: convert the reply to JSON and show it on the page
        const user = await response.json();
        // textContent is safe: it never runs API data as HTML
        result.textContent = "";
        const img = document.createElement("img");
        img.src = user.avatar_url;
        const name = document.createElement("h2");
        name.textContent = user.name || user.login;
        const repos = document.createElement("p");
        repos.textContent = "Public repos: " + user.public_repos;
        const followers = document.createElement("p");
        followers.textContent = "Followers: " + user.followers;
        const link = document.createElement("a");
        link.href = user.html_url;
        link.target = "_blank";
        link.textContent = "Open profile";
        result.append(img, name, repos, followers, link);
      } catch (error) {
        result.textContent = "Network problem: " + error.message;
      }
    }
  </script>
</body>
</html>
